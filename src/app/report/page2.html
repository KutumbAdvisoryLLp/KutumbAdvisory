<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Kutumb Advisory Kundali — Cover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4 portrait;
            margin: 0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            background: #eeeeee;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .page {
            width: 210mm;
            height: 297mm;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #111111;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* ===== TITLE BLOCK ===== */
        .cover-header {
            position: absolute;
            top: 28mm;
            left: 0;
            width: 100%;
            text-align: center;
        }

        .cover-header h1 {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: #1a1a2e;
            text-transform: uppercase;
        }

        .cover-header h2 {
            margin-top: 11mm;
            font-size: 17px;
            font-weight: 400;
            color: #1a1a2e;
        }

        .cover-header p {
            margin-top: 6mm;
            font-size: 12.5px;
            font-weight: 400;
            color: #1a1a2e;
        }

        /* ===== EMBLEM ===== */
        .brand-emblem {
            position: absolute;
            top: 72mm;
            left: 0;
            width: 100%;
            text-align: center;
        }

        .brand-emblem img {
            width: 95mm;
            height: auto;
            max-height: 95mm;
            object-fit: contain;
        }

        /* ===== CLIENT INFORMATION ===== */
        .client-information {
            position: absolute;
            top: 190mm;
            left: 8%;
            width: 84%;
        }

        .client-information .field {
            display: flex;
            align-items: center;
            margin-bottom: 7mm;
            padding: 4px 0;
        }

        .client-information .label {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 180px;
        }

        .client-information .field-val {
            font-size: 16px;
            font-weight: 700;
            color: #172A4A;
            padding-left: 12px;
        }

        /* ===== FOOTER ===== */
        footer {
            position: absolute;
            bottom: 4%;
            left: 5%;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: #111111;
        }

        .emblem {
            position: absolute;
            bottom: 3%;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 22px;
        }

        .emblem svg {
            width: 100%;
            height: 100%;
        }

        .emblem text {
            font-size: 7px;
            font-weight: 600;
            fill: #333333;
            font-family: Arial, sans-serif;
        }

        @media print {
            html, body {
                width: 210mm;
                height: 297mm;
                margin: 0;
                padding: 0;
            }
            body { background: #ffffff; }
            .page { width: 210mm; height: 297mm; margin: 0; box-shadow: none; }
        }
    </style>
</head>

<body>

    <main class="page">

        <header class="cover-header">
            <h1>Kutumb Advisory Kundali™</h1>
            <h2>Family Financial Wealth Assessment</h2>
            <p>The Financial Blueprint for Multi-Generational Wealth Creation</p>
        </header>

        <section class="brand-emblem">
            <img src="/report/pagelogo_transparent.png" alt="Kutumb Advisory LLP emblem">
        </section>

        <section class="client-information">
            <div class="field">
                <span class="label">CLIENT NAME:</span>
                <span class="field-val client-name-val"></span>
            </div>
            <div class="field">
                <span class="label">ASSESSMENT DATE:</span>
                <span class="field-val assessment-date-val"></span>
            </div>
            <div class="field">
                <span class="label">ADVISOR NAME:</span>
                <span class="field-val advisor-name-val">Kutumb Wealth Advisor</span>
            </div>
        </section>

        <footer>Kutumb Advisory LLP</footer>

        <div class="emblem">
            <svg viewBox="0 0 46 40" xmlns="http://www.w3.org/2000/svg">
                <g fill="none" stroke="#333333" stroke-width="0.8">
                    <rect x="9" y="6" width="28" height="28" transform="rotate(45 23 20)" />
                    <rect x="13" y="10" width="20" height="20" />
                </g>
                <text x="23" y="23" text-anchor="middle" font-size="7">2</text>
            </svg>
        </div>

    </main>

</body>

</html>
